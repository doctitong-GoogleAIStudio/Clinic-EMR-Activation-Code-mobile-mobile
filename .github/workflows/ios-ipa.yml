# Builds the Clinic EMR iOS app (iPhone + iPad) as an .ipa on a macOS runner.
#
# Without Apple signing secrets it produces an UNSIGNED .ipa, which can be
# installed by re-signing with a personal Apple ID (Sideloadly, AltStore,
# Xcode) — enough for testing on your own devices.
#
# For TestFlight / App Store, add these repository secrets and the workflow
# will also produce a signed .ipa:
#   IOS_CERT_P12_BASE64   base64 of the distribution certificate (.p12)
#   IOS_CERT_PASSWORD     password of that .p12
#   IOS_PROFILE_BASE64    base64 of the matching provisioning profile (.mobileprovision)
#   IOS_TEAM_ID           Apple Developer Team ID
#   IOS_EXPORT_METHOD     app-store | ad-hoc | development   (default app-store)
name: iOS ipa

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend URL baked into the app
        default: https://emr-licensing-gate.emergent.host
        required: true
  push:
    branches: [main, remove-activation]
    paths:
      - frontend/ios/**
      - .github/workflows/ios-ipa.yml

env:
  BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://emr-licensing-gate.emergent.host' }}
  APP_VERSION: 1.0.2

jobs:
  ipa:
    name: iOS (iPhone + iPad)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web app
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ env.BACKEND_URL }}
          GENERATE_SOURCEMAP: "false"
          CI: "false"
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          npx cap sync ios

      - name: Archive (unsigned)
        working-directory: frontend/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          test -d build/App.xcarchive/Products/Applications/App.app

      - name: Package unsigned ipa
        working-directory: frontend/ios/App
        run: |
          mkdir -p out/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app out/Payload/
          (cd out && zip -qry "Clinic EMR-${APP_VERSION}-unsigned.ipa" Payload)
          ls -la out

      # ---------- signed build (only when the secrets exist) ----------
      - name: Import signing certificate and profile
        if: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/app.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/app.mobileprovision)")
          cp $RUNNER_TEMP/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Archive and export signed ipa
        if: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' }}
        working-directory: frontend/ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'app-store' }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App-signed.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" -quiet
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.ddhapps.clinicemr</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App-signed.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath out/signed -quiet
          mv "out/signed/App.ipa" "out/Clinic EMR-${APP_VERSION}-${EXPORT_METHOD}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Clinic-EMR-iOS
          if-no-files-found: error
          path: frontend/ios/App/out/*.ipa
